<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="100%" stop-color="#0f121a" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" rx="150" fill="url(#avatarBg)" />
  <circle cx="150" cy="150" r="142" fill="none" stroke="url(#goldRing)" stroke-width="3" stroke-dasharray="6 6" />

  <g transform="translate(150, 130)">
    <circle r="36" fill="rgba(245, 158, 11, 0.12)" stroke="url(#goldRing)" stroke-width="2" />
    <!-- User silhouette -->
    <circle cx="0" cy="-6" r="14" fill="#f59e0b" opacity="0.85" />
    <path d="M-22 24 C-22 13 -13 6 0 6 C13 6 22 13 22 24 Z" fill="#f59e0b" opacity="0.85" />
    
    <text y="64" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="1.5">
      PHOTO
    </text>
    <text y="82" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#f59e0b" letter-spacing="1.5">
      COMING SOON
    </text>
  </g>

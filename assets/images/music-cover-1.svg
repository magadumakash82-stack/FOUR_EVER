<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="vinylGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d3345" />
      <stop offset="40%" stop-color="#141724" />
      <stop offset="90%" stop-color="#0a0c12" />
      <stop offset="100%" stop-color="#050609" />
    </radialGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#vinylGrad)" />
  <!-- Vinyl grooves -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5" />
  <circle cx="200" cy="200" r="100" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" />
  <circle cx="200" cy="200" r="70" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5" />
  <!-- Center label -->
  <circle cx="200" cy="200" r="50" fill="#1e2433" stroke="url(#goldAcc)" stroke-width="2" />
  <circle cx="200" cy="200" r="12" fill="#0b0d14" />
  <text x="200" y="195" text-anchor="middle" font-family="'Cinzel', serif, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" letter-spacing="2">YEAR 1</text>
  <text x="200" y="212" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">THE BEGINNING</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="logoGear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Engineering Gear (representing Engineering) -->
  <g transform="translate(50, 52) scale(0.85)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#logoGear)" stroke-width="4.5" opacity="0.35" />
    <!-- Gear teeth -->
    <path d="M-6 -34 L6 -34 L5 -29 L-5 -29 Z
             M-6 34 L6 34 L5 29 L-5 29 Z
             M-34 -6 L-34 6 L-29 5 L-29 -5 Z
             M34 -6 L34 6 L29 5 L29 -5 Z
             M-24 -24 L-15 -15 L-12 -18 L-21 -27 Z
             M24 24 L15 15 L12 18 L21 27 Z
             M-24 24 L-15 15 L-18 12 L-27 21 Z
             M24 -24 L15 -15 L18 -12 L27 -21 Z" 
          fill="url(#logoGear)" opacity="0.35" />
  </g>

  <!-- Graduation Cap (representing College Life) -->
  <g transform="translate(50, 42)">
    <!-- Cap Diamond Top -->
    <polygon points="0,-22 36,-8 0,6 -36,-8" fill="url(#logoGold)" />
    <!-- Skull Cap Base -->
    <path d="M-22,-2 L-22,12 C-22,22 22,22 22,12 L22,-2 C16,4 -16,4 -22,-2 Z" fill="#d97706" />
    <!-- Tassel Button & Cord -->
    <circle cx="0" cy="-8" r="3.5" fill="#fef3c7" />
    <path d="M0,-8 C14,-6 24,-2 26,8 L26,18" fill="none" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round" />
    <!-- Tassel End -->
    <polygon points="23,18 29,18 27.5,25 24.5,25" fill="#fef3c7" />
  </g>

  <!-- 4 Stars / Sparks (representing the 4 Friends) -->
  <circle cx="28" cy="74" r="2" fill="#38bdf8" />
  <circle cx="42" cy="78" r="2.5" fill="#f59e0b" />
  <circle cx="58" cy="78" r="2.5" fill="#10b981" />
  <circle cx="72" cy="74" r="2" fill="#f43f5e" />
</svg>
